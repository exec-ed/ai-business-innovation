name: Build Course Materials

on:
  push:
    branches: [ main ]
    paths:
      - 'participant-materials/**'
      - 'pre-readings/**'
      - 'instructor-materials/**'
      - 'build/**'
      - '.github/workflows/build-materials.yml'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Pandoc
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install LaTeX (for PDF generation)
      run: |
        sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-latex-extra texlive-fonts-extra

    - name: Create output directories
      run: |
        mkdir -p docs/pdf
        mkdir -p docs/css
        mkdir -p docs/js
        mkdir -p docs/instructor
        mkdir -p docs/instructor/pdf

    - name: Run build script
      run: bash build/scripts/build.sh

    - name: Commit generated files
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build course materials [skip ci]"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: main
